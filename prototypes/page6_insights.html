<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241d18; --sub:#8b8178; --faint:#b3a99d; --line:#e9ddd0; --hair:#f3ece2;
    --bg:#fdf6ee; --card:#ffffff;
    --above:#3d9668; --below:#c2483f; --within:#a89c8d; --amber:#c98a2b;
    --above-bg:#e6f2ea; --below-bg:#f9e6e3; --within-bg:#f1ece4;
    --self:#e8583a; --accent-soft:#fbe4da;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html, body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow:hidden;}
  .display{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.015em;}

  .frame{padding:34px;height:100vh;}
  .shell{max-width:1400px;margin:0 auto;background:#f0c39e;border-radius:28px;padding:14px;display:flex;gap:14px;height:100%;overflow:hidden;}
  .sidebar{width:220px;flex-shrink:0;background:#faf3ea;border-radius:20px;padding:26px 20px;display:flex;flex-direction:column;height:100%;overflow-y:auto;}
  .sb-brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;}
  .sb-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--self);display:inline-block;}
  .sb-profile{margin-top:32px;}
  .sb-cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding:13px;border-radius:14px;background:var(--self);color:#fff;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 4px 10px -3px rgba(232,88,58,.45);}
  .sb-cta:hover{filter:brightness(1.05);}
  .sb-cta .plus{font-size:17px;line-height:1;}
  .sb-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--self),#f4a06f);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .sb-name{font-size:14px;font-weight:800;margin-top:10px;}
  .sb-role{font-size:11px;color:var(--sub);margin-top:1px;}
  .sb-nav{margin-top:26px;display:flex;flex-direction:column;gap:4px;}
  .sb-nav a{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--sub);text-decoration:none;padding:10px 12px;border-radius:10px;}
  .sb-nav a .ic{width:16px;text-align:center;}
  .sb-nav a.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .sb-nav a.active .ic{color:var(--self);}
  .sb-foot-group{margin-top:auto;display:flex;flex-direction:column;gap:2px;}
  .sb-foot-group a{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);text-decoration:none;padding:10px 12px;border-radius:10px;}
  .sb-foot-group a:hover{background:var(--hair);color:var(--sub);}
  .maincard{flex:1;background:var(--card);border-radius:20px;padding:30px 34px 40px;height:100%;overflow-y:auto;}

  .h1{font-size:32px;}
  .h-sub{font-size:13px;color:var(--sub);margin-top:8px;max-width:600px;line-height:1.6;}

  .filter-row{display:flex;gap:8px;margin-top:22px;}
  .filter-chip{font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;border:1px solid var(--line);color:var(--sub);cursor:pointer;background:#fff;}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .ins-list{margin-top:20px;display:flex;flex-direction:column;}
  .ins-row{display:flex;align-items:flex-start;gap:14px;padding:16px 4px;border-top:1px solid var(--hair);}
  .ins-row:first-child{border-top:none;}
  .ins-tag{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:5px;flex-shrink:0;margin-top:3px;}
  .ins-tag.content{background:var(--accent-soft);color:var(--self);}
  .ins-tag.commercial{background:#fdeee0;color:#c07a1e;}
  .ins-body{flex:1;}
  .ins-title{font-size:14px;font-weight:700;}
  .ins-text{font-size:13px;color:var(--ink);margin-top:3px;line-height:1.5;}
  .ins-meta{font-size:11.5px;color:var(--faint);margin-top:5px;}
  .ins-conf{font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .ins-conf.high{background:var(--above-bg);color:var(--above);}
  .ins-conf.medium{background:#fdf3e3;color:var(--amber);}
  .ins-conf.low, .ins-conf.none{background:var(--below-bg);color:var(--below);}
  .ins-link{font-size:12px;font-weight:700;color:var(--self);text-decoration:none;flex-shrink:0;white-space:nowrap;margin-top:2px;}

  .empty{margin-top:60px;text-align:center;color:var(--sub);font-size:13px;line-height:1.8;}
</style>
</head>
<body>
<div class="frame">
  <div class="shell">

    <aside class="sidebar">
      <div class="sb-brand"><span class="dot"></span>Campaign Review</div>
      <div class="sb-profile">
        <div class="sb-avatar">CJ</div>
        <div class="sb-name">Creator Account</div>
        <div class="sb-role">TikTok · Sponsored content</div>
      </div>
      <a class="sb-cta" href="page3_entry.html"><span class="plus">+</span>New Content</a>
      <nav class="sb-nav">
        <a href="page0_dashboard.html"><span class="ic">▦</span>Dashboard</a>
        <a href="page1_calendar.html"><span class="ic">▤</span>Calendar</a>
        <a class="active" href="page6_insights.html"><span class="ic">◔</span>Insight</a>
        <a href="page5_how_it_works.html"><span class="ic">⚙</span>How it works</a>
      </nav>
      <div class="sb-foot-group">
        <a href="#"><span>⚙</span>Settings</a>
        <a href="#"><span>⏻</span>Log out</a>
      </div>
    </aside>

    <main class="maincard">
      <div class="h1 display">Insight</div>
      <div class="h-sub">Every piece where something stood out — ranked most recent first. Each one links straight to its full diagnosis.</div>

      <div class="filter-row" id="filterRow"></div>
      <div class="ins-list" id="insList"></div>
    </main>
  </div>
</div>

<script src="js/engine.js"></script>
<script>
  const all = CCR.getAllPieces().slice().sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  const withRules = all.map(p => ({ p, d: CCR.diagnose(p.id) })).filter(x => x.d.fired.length);

  const sides = ['all', 'content', 'commercial'];
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = sides.map(s => `<div class="filter-chip${s==='all'?' active':''}" data-side="${s}">${s==='all' ? 'All' : s[0].toUpperCase()+s.slice(1)}</div>`).join('');

  function render(filterSide){
    const list = document.getElementById('insList');
    const rows = withRules.filter(({d}) => filterSide === 'all' || d.fired.some(f => f.side === filterSide));
    if (!rows.length){
      list.innerHTML = '<div class="empty">Nothing flagged here yet.</div>';
      return;
    }
    list.innerHTML = rows.map(({p, d}) => {
      const f = d.fired.find(f => filterSide === 'all' || f.side === filterSide) || d.fired[0];
      return `<div class="ins-row">
        <span class="ins-tag ${f.side}">${f.rule}</span>
        <div class="ins-body">
          <div class="ins-title">${p.campaign} <span class="ins-conf ${d.confidence}">${d.confidence}</span></div>
          <div class="ins-text">${f.text} ${f.evidence}</div>
          <div class="ins-meta">${p.product} · ${p.platform} · ${new Date(p.publishedAt).toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'})}</div>
        </div>
        <a class="ins-link" href="page4_review.html?piece=${p.id}">View review →</a>
      </div>`;
    }).join('');
  }

  filterRow.querySelectorAll('.filter-chip').forEach(chip => {
    chip.onclick = () => {
      filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render(chip.dataset.side);
    };
  });

  render('all');
</script>
</body>
</html>
